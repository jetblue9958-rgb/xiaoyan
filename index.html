<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>小衍 V5</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f5f1e8;color:#2d2a26} .wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fffdf8;border:1px solid #ddd3c4;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0000000a} h1,h2{margin:0 0 12px} input,button,select{font:inherit;padding:10px 12px;border:1px solid #cfc4b4;border-radius:9px;background:white}button{cursor:pointer;background:#2d2a26;color:white}.muted{color:#756e65;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.mode button.active{background:#8b5e34}.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.pile{min-height:120px;border:2px dashed #cfc4b4;border-radius:12px;text-align:center;padding:12px;background:#faf7f0}.pile strong{display:block;font-size:20px;margin-bottom:8px}.pile .count{font-size:28px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}.step{padding:12px;border-radius:10px;background:#f2ede3}.value{font-size:42px;font-weight:700;text-align:center;margin:8px}.linegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.line{border:1px solid #ddd3c4;border-radius:9px;padding:10px;text-align:center;background:#fff}.line b{font-size:24px}.progress{height:10px;background:#e4ddd2;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#8b5e34}.tablewrap{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e4ddd2;padding:7px 8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{background:#eee7dc;color:#2d2a26}.tabs button.active{background:#2d2a26;color:#fff}.notice{padding:10px;border-left:4px solid #8b5e34;background:#f5efe5}.danger{color:#8b2d2d}@media(max-width:700px){.steps{grid-template-columns:1fr}.linegrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div class="wrap">
<h1>小衍 V5</h1><p class="muted">64 張牌／固定牌／天・人・地二次取人／六爻逐次生成／4096 組＋64 卦模擬驗證</p>
<div class="card mode"><div class="row"><button id="formalBtn" class="active">正式起卦</button><button id="testBtn">測試模式</button></div></div>

<section id="formal">
<div class="card"><h2>① 先寫問題</h2><textarea id="question" rows="3" style="width:100%;box-sizing:border-box;border:1px solid #cfc4b4;border-radius:9px;padding:10px" placeholder="請寫下這一卦要觀察的事情"></textarea><div class="row" style="margin-top:10px"><button id="startBtn">開始起卦</button><span id="lockMsg" class="muted"></span></div></div>
<div id="formalArea" class="card hidden"><h2 id="roundTitle">第 1 爻</h2><div class="notice">固定牌：<b id="fixedCard">—</b>　｜　本輪剩餘牌：63 張</div><div class="piles"><div class="pile"><strong>天</strong><div class="count" id="tian1">—</div></div><div class="pile"><strong>人</strong><div class="count" id="ren1">—</div></div><div class="pile"><strong>地</strong><div class="count" id="di1">—</div></div></div><div class="steps"><div class="step">第一次分牌：<b>天／人／地</b> → 取「人」堆</div><div class="step">第二次分牌：<b>天／人／地</b> → 取「人」堆 → 抽牌</div></div><div class="row" style="margin-top:12px"><button id="nextStepBtn">開始本爻</button><span id="stepMsg" class="muted"></span></div><div class="value" id="drawValue">—</div><div class="linegrid" id="lineGrid"></div></div>
</section>

<section id="test" class="hidden">
<div class="card"><h2>測試模式</h2><p class="muted">測試不寫入正式紀錄。可跑完整六爻，也可跑大量模擬。</p><div class="row"><button id="oneTest">一鍵測試一卦</button><input id="simN" type="number" min="1" max="1000000" step="1" value="1000000"><button id="simBtn">開始模擬</button></div><div style="margin-top:12px" class="progress"><div id="bar" class="bar"></div></div><p id="simStatus" class="muted">尚未開始</p></div>
<div id="oneResult" class="card hidden"><h2>測試一卦結果</h2><div id="oneDigits" class="value">—</div><p id="oneHex" class="muted"></p></div>
<div id="stats" class="card hidden"><h2>模擬結果</h2><div class="row"><span>總次數：<b id="totalN">0</b></span><span>64卦平均：<b id="mean64">0</b></span><span>理論值：<b>15,625</b></span><span>最低：<b id="min64">0</b></span><span>最高：<b id="max64">0</b></span><span>標準差：<b id="sd64">0</b></span></div><div class="tabs"><button id="tab64" class="active">64卦</button><button id="tab4096">4096組六碼</button></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
</section>

<div class="card"><h2>正式紀錄</h2><div id="records" class="muted">尚無正式紀錄</div></div>
</div>
<script>
const cards=[]; const suits=['萬','餅','索'];
for(const v of [6,9]) for(const s of ['萬','餅']) for(let i=0;i<4;i++) cards.push({v,s,i});
for(const v of [1,3,5]) for(const s of ['萬','餅']) for(let i=0;i<4;i++) cards.push({v:7,s,i});
for(const v of [2,4]) for(const s of ['萬','餅','索']) for(let i=0;i<4;i++) cards.push({v:8,s,i});
function cardName(c){return c.v+c.s+(c.i+1)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// V5 keeps the full two-stage state machine. The physical split algorithm is isolated here so it can be replaced by the final small-yen dealing rule later.
function splitThree(deck){const a=[],b=[],c=[]; deck.forEach((x,i)=>[a,b,c][i%3].push(x)); return [a,b,c]}
function drawLine(){
 let deck=cards.slice(); const fixed=deck.splice(Math.floor(Math.random()*deck.length),1)[0];
 const [t1,r1,d1]=splitThree(shuffle(deck.slice())); const [t2,r2,d2]=splitThree(shuffle(r1.slice()));
 const card=r2[Math.floor(Math.random()*r2.length)]; return {v:card.v,fixed};
}
function fullRun(){let fixed; let digits=''; for(let i=0;i<6;i++){const x=drawLine(); if(i===0)fixed=x.fixed; digits+=x.v} return {digits,fixed}}
function yin(v){return v===6||v===8?0:1}
const names=['乾','姤','遯','否','觀','剝','晉','大有','夬','大過','困','萃','咸','蹇','謙','小過','履','中孚','節','損','睽','離','家人','既濟','大壯','恒','解','豫','小畜','需','訟','未濟','同人','革','隨','屯','益','震','噬嗑','隨','無妄','明夷','賁','既濟','大畜','頤','復','姤','大過','困','井','巽','升','訟','渙','坎','未濟','解','師','蒙','坤','謙','艮','賁','泰','否'];
// Display names use a stable 0..63 binary index (bottom line is low bit). Names above are a compact fallback list; the statistical test itself is pattern-based.
function hexKey(d){return [...d].map(yin).join('')}
function runHexCounts(n){const raw=Object.fromEntries(allRaw().map(x=>[x,0])); const hex=Object.fromEntries(Array.from({length:64},(_,i)=>[i,0]));
 for(let i=0;i<n;i++){const d=fullRun().digits; raw[d]++; let idx=0; [...d].forEach((v,k)=>{idx|=(yin(+v)<<k)}); hex[idx]++}
 return {raw,hex}}
function allRaw(){let out=[];for(const a of [6,7,8,9])for(const b of [6,7,8,9])for(const c of [6,7,8,9])for(const d of [6,7,8,9])for(const e of [6,7,8,9])for(const f of [6,7,8,9])out.push(''+a+b+c+d+e+f);return out}
function fmt(x){return x.toLocaleString('zh-TW')}
let lastStats=null,show64=true;
function render64(hex,n){const vals=Object.values(hex), mean=n/64; document.getElementById('mean64').textContent=fmt(Math.round(vals.reduce((a,b)=>a+b,0)/64));document.getElementById('min64').textContent=fmt(Math.min(...vals));document.getElementById('max64').textContent=fmt(Math.max(...vals));document.getElementById('sd64').textContent=(Math.sqrt(vals.reduce((s,x)=>s+(x-mean)**2,0)/64)).toFixed(2);document.getElementById('thead').innerHTML='<tr><th>索引</th><th>陰陽型態（下→上）</th><th>次數</th><th>偏離理論值</th></tr>';document.getElementById('tbody').innerHTML=Object.keys(hex).map(k=>{const v=hex[k], pat=Number(k).toString(2).padStart(6,'0').split('').reverse().join('');return `<tr><td>${+k+1}</td><td>${pat}</td><td>${fmt(v)}</td><td>${(v-mean).toLocaleString('zh-TW')}</td></tr>`}).join('')}
function renderRaw(raw){document.getElementById('thead').innerHTML='<tr><th>六碼</th><th>次數</th></tr>';document.getElementById('tbody').innerHTML=Object.keys(raw).map(k=>`<tr><td>${k}</td><td>${fmt(raw[k])}</td></tr>`).join('')}
function render(){if(!lastStats)return;show64?render64(lastStats.hex,lastStats.n):renderRaw(lastStats.raw)}

document.getElementById('formalBtn').onclick=()=>{formal.classList.remove('hidden');test.classList.add('hidden');formalBtn.classList.add('active');testBtn.classList.remove('active')};
document.getElementById('testBtn').onclick=()=>{formal.classList.add('hidden');test.classList.remove('hidden');testBtn.classList.add('active');formalBtn.classList.remove('active')};
let session=null;
document.getElementById('startBtn').onclick=()=>{const q=document.getElementById('question').value.trim();if(!q){alert('請先寫下問題');return}session={q,lines:[],fixed:null,round:0};question.disabled=true;startBtn.disabled=true;formalArea.classList.remove('hidden');nextStepBtn.disabled=false;lockMsg.textContent='問題已鎖定，本卦完成前不修改。';lineGrid.innerHTML='';}
document.getElementById('nextStepBtn').onclick=()=>{if(!session)return; const x=drawLine(); if(!session.fixed)session.fixed=x.fixed; session.round++; roundTitle.textContent=`第 ${session.round} 爻`; fixedCard.textContent=cardName(session.fixed); const sizes=[21,21,21]; tian1.textContent=sizes[0];ren1.textContent=sizes[1];di1.textContent=sizes[2];stepMsg.textContent='第一次取人 → 第二次取人 → 已抽出本爻';drawValue.textContent=x.v;session.lines.push(x.v);lineGrid.innerHTML=session.lines.map((v,i)=>`<div class="line"><div>第${i+1}爻</div><b>${v}</b></div>`).join(''); if(session.round===6){nextStepBtn.disabled=true;saveRecord();stepMsg.textContent='六爻完成，已保存正式紀錄。';}};
function saveRecord(){const rec={id:Date.now().toString(36),time:new Date().toLocaleString('zh-TW'),question:session.q,fixed:cardName(session.fixed),digits:session.lines.join('')};let arr=JSON.parse(localStorage.getItem('xiaoyan_v5_records')||'[]');arr.unshift(rec);localStorage.setItem('xiaoyan_v5_records',JSON.stringify(arr));renderRecords();}
function renderRecords(){const arr=JSON.parse(localStorage.getItem('xiaoyan_v5_records')||'[]');records.innerHTML=arr.length?arr.map(r=>`<div style="padding:10px 0;border-bottom:1px solid #e4ddd2"><b>${r.digits}</b>　${r.time}<br><span class="muted">問題：${escapeHtml(r.question)}｜固定牌：${r.fixed}｜ID：${r.id}</span></div>`).join(''):'尚無正式紀錄'}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
renderRecords();

document.getElementById('oneTest').onclick=()=>{const r=fullRun();oneResult.classList.remove('hidden');oneDigits.textContent=r.digits;oneHex.textContent='陰陽型態（下→上）：'+[...r.digits].map(v=>yin(+v)?'陽':'陰').join('、')};
document.getElementById('simBtn').onclick=async()=>{const n=Math.min(1000000,Math.max(1,Number(simN.value)||1));simBtn.disabled=true;oneTest.disabled=true;bar.style.width='0%';simStatus.textContent='模擬中…';const raw=Object.fromEntries(allRaw().map(x=>[x,0]));const hex=Object.fromEntries(Array.from({length:64},(_,i)=>[i,0]));const chunk=5000;for(let start=0;start<n;start+=chunk){const end=Math.min(n,start+chunk);for(let i=start;i<end;i++){const d=fullRun().digits;raw[d]++;let idx=0;[...d].forEach((v,k)=>idx|=(yin(+v)<<k));hex[idx]++}bar.style.width=(end/n*100).toFixed(1)+'%';simStatus.textContent=`已完成 ${fmt(end)} / ${fmt(n)}`;await new Promise(r=>setTimeout(r,0))}lastStats={n,raw,hex};stats.classList.remove('hidden');totalN.textContent=fmt(n);render();simStatus.textContent='完成。測試資料不寫入正式紀錄。';simBtn.disabled=false;oneTest.disabled=false};
tab64.onclick=()=>{show64=true;tab64.classList.add('active');tab4096.classList.remove('active');render()};tab4096.onclick=()=>{show64=false;tab4096.classList.add('active');tab64.classList.remove('active');render()};
</script></body></html>
